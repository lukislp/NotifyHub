name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger for the backfill-release-signatures job at the bottom of this file.
  # Nothing else in this workflow runs on it.
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to sign, space separated. Empty means the five most recent releases."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release

permissions:
  contents: read
  actions: read

jobs:
  # ---------------------------------------------------------------------
  # Test stage — runs on every push to main AND every pull request
  # ---------------------------------------------------------------------
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # NotifyHub/NotifyHub.AspNetCore multi-target net8.0;net10.0 - both SDKs must be
      # installed side by side for one `dotnet test` run to exercise both.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore tests/NotifyHub.Tests/NotifyHub.Tests.csproj --locked-mode
      - run: dotnet test tests/NotifyHub.Tests/NotifyHub.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet restore NotifyHub.slnx --locked-mode
      - run: dotnet build NotifyHub.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

  # ---------------------------------------------------------------------
  # Version / pack / release — push to main only
  # ---------------------------------------------------------------------
  get-version:
    needs: [test, build]
    if: github.event_name == 'push'
    concurrency:
      group: notifyhub-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Packs both libraries at the version the dry run just determined and uploads the
  # .nupkg/.snupkg files as a build artifact for the release job to attach to the GitHub
  # Release. Deliberately does NOT push to nuget.org - no NUGET_API_KEY secret yet; add a
  # `dotnet nuget push ... --source https://api.nuget.org/v3/index.json` step here (gated
  # on that secret being set) once it exists.
  pack:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: notifyhub-release-chain
      cancel-in-progress: false
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - run: dotnet pack src/NotifyHub/NotifyHub.csproj --configuration ${{ env.CONFIGURATION }} -p:Version=${{ env.NEXT_VERSION }} -o ${{ github.workspace }}/artifacts/nuget
      - run: dotnet pack src/NotifyHub.AspNetCore/NotifyHub.AspNetCore.csproj --configuration ${{ env.CONFIGURATION }} -p:Version=${{ env.NEXT_VERSION }} -o ${{ github.workspace }}/artifacts/nuget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          retention-days: 7

  release:
    needs: [get-version, pack]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    concurrency:
      group: notifyhub-release-chain
      cancel-in-progress: false
    uses: lukislp/lktec-bot/.github/workflows/release.yml@d2e0693df66fa10167181e6c3844cdc2032f4399 # v0.7.2
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Everything that used to run inside the release job after the tag: attach the NuGet
  # packages to the GitHub Release (the assets the old release step uploaded), then the
  # keyless signatures and the build provenance (OpenSSF Scorecard "Signed-Releases"): a Sigstore
  # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next to the
  # assets so a download can be verified offline:
  #   cosign verify-blob --bundle <asset>.sigstore.json \
  #     --certificate-identity-regexp '^https://github.com/lukislp/NotifyHub/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
  release-assets:
    needs: [release]
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: notifyhub-release-chain
      cancel-in-progress: false
    permissions:
      contents: write
      # Keyless signing + build provenance for the release assets.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: packages
      - name: Attach the NuGet packages to the release
        run: |
          for f in packages/*.nupkg; do
            gh release upload "$TAG" "$f#NuGet package" --clobber --repo "$GITHUB_REPOSITORY"
          done
          for f in packages/*.snupkg; do
            gh release upload "$TAG" "$f#Symbol package" --clobber --repo "$GITHUB_REPOSITORY"
          done
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the release assets and attach the signature bundles
        run: |
          for f in packages/*.nupkg packages/*.snupkg; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/NotifyHub/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber --repo "$GITHUB_REPOSITORY"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            packages/*.nupkg
            packages/*.snupkg
      - name: Attach the build provenance to the release
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber --repo "$GITHUB_REPOSITORY"

  # ---------------------------------------------------------------------
  # Signature backfill for older releases - manual dispatch only
  # ---------------------------------------------------------------------
  # Releases published before the signing step above existed carry no Sigstore bundle next
  # to their assets, and OpenSSF Scorecard's "Signed-Releases" check grades the five most
  # recent releases - so those older ones hold the score down until they age out. This job
  # signs them after the fact: for every asset of the selected releases that has no
  # <asset>.sigstore.json sibling yet, it downloads the asset, signs it keylessly, verifies
  # the bundle and uploads the bundle next to the asset. Re-running it is a no-op for
  # assets that already have a bundle.
  #
  # It deliberately lives in THIS workflow file instead of a file of its own. The keyless
  # certificate's identity is "<repo>/<workflow path>@<ref>", so a dispatch of
  # .github/workflows/ci-cd.yml on refs/heads/main mints exactly the identity the
  # release path mints, and the bundles satisfy the very same
  # --certificate-identity-regexp the release job pins. That is asserted per asset below -
  # a mismatch fails the step before anything is uploaded.
  #
  # No build provenance is attached here on purpose: attest-build-provenance would assert
  # that this run built the artifact, which is false for an artifact downloaded from an
  # older release.
  backfill-release-signatures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the assets of releases that have no signature bundle yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "${TAGS// /}" ]; then
            read -r -a TAG_LIST <<< "$TAGS"
          else
            mapfile -t TAG_LIST < <(gh release list --repo "$REPO" --limit 5 --json tagName --jq '.[].tagName')
          fi
          if [ "${#TAG_LIST[@]}" -eq 0 ]; then
            echo "No releases to process."
            exit 0
          fi
          echo "Releases to process: ${TAG_LIST[*]}"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          SIGNED=0
          for TAG in "${TAG_LIST[@]}"; do
            [ -n "$TAG" ] || continue
            ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              # Signature bundles and provenance files are not themselves signed.
              case "$NAME" in
                *.sigstore.json | *.intoto.jsonl) continue ;;
              esac
              if printf '%s\n' "$ASSETS" | grep -Fxq "$NAME.sigstore.json"; then
                echo "$TAG/$NAME: bundle already present, skipping"
                continue
              fi
              echo "$TAG/$NAME: signing"
              gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir "$WORK" --clobber
              cosign sign-blob --yes --bundle "$WORK/$NAME.sigstore.json" "$WORK/$NAME"
              cosign verify-blob --bundle "$WORK/$NAME.sigstore.json" \
                --certificate-identity-regexp '^https://github.com/lukislp/NotifyHub/\.github/workflows/ci-cd\.yml@refs/heads/main$' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$WORK/$NAME"
              gh release upload "$TAG" "$WORK/$NAME.sigstore.json" --repo "$REPO" --clobber
              # Release assets can be hundreds of megabytes, so don't keep them on disk.
              rm -f "$WORK/$NAME" "$WORK/$NAME.sigstore.json"
              SIGNED=$((SIGNED + 1))
            done <<< "$ASSETS"
          done
          echo "Signature bundles uploaded: $SIGNED"
